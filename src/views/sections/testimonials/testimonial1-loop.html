<div class="swiper-slide">
    <figure class="card-testimonial-1 bg-white rounded-4 position-relative mb-0">
        <div class="card-testimonial-1__stars d-flex" aria-label="5 out of 5 stars">
            <i class="ri-star-fill text-primary"></i>
            <i class="ri-star-fill text-primary"></i>
            <i class="ri-star-fill text-primary"></i>
            <i class="ri-star-fill text-primary"></i>
            <i class="ri-star-fill text-primary"></i>
        </div>
        <blockquote class="card-testimonial-1__quote text-dark mb-0">“@@quote”</blockquote>
        <figcaption class="card-testimonial-1__author d-flex align-items-center">
            <img class="avatar" src="@@avatar" alt="" width="48" height="48" loading="lazy" decoding="async" />
            <div class="ms-3">
                <div class="fs-6 fw-bold text-dark lh-sm">@@name</div>
                <div class="fs-7 text-300">@@role</div>
            </div>
        </figcaption>
    </figure>
</div>
